<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}html{overflow:hidden;width:1080px;height:1350px}
body{width:1080px;height:1350px;background:#06010f;font-family:Cairo,sans-serif;color:#fff;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(700px 520px at 50% 52%,rgba(150,60,255,.38),transparent 70%),
 radial-gradient(500px 400px at 100% 0%,rgba(255,80,200,.22),transparent 70%),
 radial-gradient(520px 420px at 0% 100%,rgba(110,60,255,.28),transparent 70%)}
.gridwrap{position:absolute;inset:0;overflow:hidden}.grid{position:absolute;left:-10%;right:-10%;bottom:0;height:420px;
 background-image:linear-gradient(rgba(190,120,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(190,120,255,.22) 1px,transparent 1px);
 background-size:70px 70px;transform:perspective(500px) rotateX(62deg);transform-origin:bottom;
 -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 90%)}
.stars i{position:absolute;width:4px;height:4px;border-radius:50%;background:#f0d0ff;box-shadow:0 0 10px #d58bff}
header{position:absolute;top:44px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:center}
header img{width:185px;filter:drop-shadow(0 0 20px rgba(200,100,255,.6))}
.tag{font-weight:800;font-size:26px;padding:12px 26px;border-radius:40px;background:linear-gradient(90deg,#ff4fc8,#8b3dff);box-shadow:0 0 30px rgba(255,79,200,.55)}
.title{position:absolute;top:215px;width:100%;text-align:center}
.title small{display:block;font-size:34px;font-weight:700;color:#e3c6ff;letter-spacing:.5px}
.title h1{font-family:Orbitron,sans-serif;font-weight:800;font-size:96px;line-height:1.1;direction:ltr;
 background:linear-gradient(180deg,#fff 10%,#f2b6ff 45%,#b45cff 75%,#7b2cff);-webkit-background-clip:text;color:transparent;
 filter:drop-shadow(0 6px 0 #3a0a6e) drop-shadow(0 0 30px rgba(190,90,255,.6))}
.title p{font-size:38px;font-weight:800;margin-top:6px}
.title p b{color:#ff7ad9}
/* device */
.stage{position:absolute;top:525px;left:50%;transform:translateX(-50%);width:640px;height:420px}
.ring{position:absolute;left:50%;top:50%;width:520px;height:520px;transform:translate(-50%,-50%);border-radius:50%;
 border:3px solid rgba(220,140,255,.6);box-shadow:0 0 60px rgba(190,90,255,.6),inset 0 0 60px rgba(190,90,255,.4)}
.ring.r2{width:600px;height:600px;border-color:rgba(160,90,255,.25);border-style:dashed}
.card{position:absolute;inset:30px 40px 40px;border-radius:34px;padding:34px 34px;
 background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.28);
 backdrop-filter:blur(8px);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 50px rgba(170,80,255,.35);display:flex;flex-direction:column;gap:14px;justify-content:center}
.msg{max-width:80%;padding:13px 20px;border-radius:20px;font-size:23px;font-weight:700;line-height:1.5}
.me{align-self:flex-start;background:linear-gradient(90deg,#8b3dff,#c04bff);border-bottom-right-radius:6px}
.ai{align-self:flex-end;background:rgba(255,255,255,.92);color:#2a0b4d;border-bottom-left-radius:6px}
.ai::before{content:"✦ ";color:#b04bff}
.typing{align-self:flex-end;display:flex;gap:8px;padding:16px 22px;background:rgba(255,255,255,.18);border-radius:22px}
.typing span{width:12px;height:12px;border-radius:50%;background:#fff;opacity:.8}
.typing span:nth-child(2){opacity:.55}.typing span:nth-child(3){opacity:.3}
.chip{position:absolute;padding:12px 20px;border-radius:18px;font-weight:800;font-size:22px;
 background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.05));border:1.5px solid rgba(255,255,255,.3);box-shadow:0 0 30px rgba(170,80,255,.45)}
.c1{top:-6px;right:-50px;transform:rotate(6deg)}.c2{bottom:-6px;left:-56px;transform:rotate(-7deg)}
/* features */
.feats{position:absolute;top:985px;left:56px;right:56px;display:flex;justify-content:space-between}
.f{width:305px;text-align:center;padding:14px 10px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(220,160,255,.25)}
.f .ic{font-size:34px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 0 10px #c46bff)}
.f b{display:block;font-size:26px}.f span{font-size:20px;color:#d7bfff}
.cta{position:absolute;bottom:50px;left:56px;right:56px;display:flex;align-items:center;justify-content:space-between;
 padding:16px 30px;border-radius:30px;background:linear-gradient(90deg,#ff4fc8,#9b3dff 60%,#6a2cff);box-shadow:0 0 50px rgba(220,80,255,.55),inset 0 2px 0 rgba(255,255,255,.4)}
.cta b{font-size:36px;line-height:1.3;font-weight:900}.cta span{font-size:24px;font-weight:700;opacity:.95}
.arrow{width:64px;height:64px;border-radius:50%;background:#fff;color:#8b3dff;display:grid;place-items:center;font-size:36px;font-weight:900}
</style></head><body>
<div class="bg"></div><div class="gridwrap"><div class="grid"></div></div><div class="stars" id="st"></div>
<header><img src="../zpro/zpro-logo-3d-transparent.png"><div class="tag">🔥 عرض محدود</div></header>
<div class="title"><small>اشتراك رسمي شهري</small><h1>ChatGPT Plus</h1><p>خلّي الذكاء الاصطناعي <b>يخدم عليك</b></p></div>
<div class="stage">
 <div class="ring r2"></div><div class="ring"></div>
 <div class="card">
  <div class="msg me">اكتبلي منشور لمنتجي 🛍️</div>
  <div class="msg ai">واجد! هاهو منشور احترافي في ثواني…</div>
  <div class="msg me">ودير لي فكرة لوغو 🎨</div>
  <div class="typing"><span></span><span></span><span></span></div>
 </div>
 <div class="chip c1">⚡ GPT‑4o</div><div class="chip c2">🖼️ صور + ملفات</div>
</div>
<div class="feats">
 <div class="f"><div class="ic">⚡</div><b>تفعيل فوري</b><span>في دقائق</span></div>
 <div class="f"><div class="ic">🛡️</div><b>ضمان كامل</b><span>طول مدة الاشتراك</span></div>
 <div class="f"><div class="ic">💬</div><b>دعم سريع</b><span>24/7</span></div>
</div>
<div class="cta"><div><b>اطلب الآن</b><br><span>السعر والتفاصيل عبر واتساب</span></div><div class="arrow">←</div></div>
<script>
const st=document.getElementById('st');let s=7;const r=()=>(s=(s*9301+49297)%233280)/233280;
for(let i=0;i<55;i++){const e=document.createElement('i');e.style.left=r()*1080+'px';e.style.top=r()*1350+'px';const z=1+r()*4;e.style.width=e.style.height=z+'px';e.style.opacity=.3+r()*.7;st.appendChild(e)}
</script></body></html>
